name: Deploy to GitHub Pages

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress means a rapid follow-up push to production can cancel an
# in-flight run, including a release job mid-publish (a tag could briefly exist
# without its zip). Accepted for this PoC: the newer push supersedes and cuts
# its own release; a dangling tag can be deleted manually if it ever happens.
concurrency:
  group: pages
  cancel-in-progress: true

# Action versions float on majors (@v6 etc.). For a workflow with
# contents: write, SHA-pinning the actions is the stricter supply-chain
# hardening; floating majors are accepted for this PoC.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Public-by-design values (OAuth public client id, public proxy URL,
      # registered redirect URI) baked into the public bundle: the Pages
      # site requires EEN sign-in. CLIENT_SECRET stays proxy-side.
      - run: npx vite build --base=/sphere/
        env:
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_EEN_CLIENT_ID: ${{ secrets.VITE_EEN_CLIENT_ID }}
          VITE_REDIRECT_URI: https://klaushofrichter.github.io/sphere
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # Same files, kept as a regular artifact so the release job can
      # package exactly what was deployed (no rebuild drift).
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Live E2E Verification
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:live
        env:
          LIVE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      # Playwright's failure artifacts (error-context ARIA snapshots, report
      # attachments) can contain the typed TEST_USER value if the journey
      # fails on the IdP login page. Scrub both values before uploading.
      # The scrub is text-only (ARIA snapshots, report HTML): it cannot reach
      # pixels in screenshots or strings inside compressed traces. Capture
      # stays DISABLED for credential-bearing steps (see playwright configs);
      # that disable is the primary guarantee, this step is the backstop.
      - name: Redact test credentials from report artifacts
        if: failure()
        env:
          TEST_USER_VALUE: ${{ secrets.TEST_USER }}
          TEST_PASSWORD_VALUE: ${{ secrets.TEST_PASSWORD }}
        run: |
          for VAL in "$TEST_USER_VALUE" "$TEST_PASSWORD_VALUE"; do
            [ -n "$VAL" ] || continue
            grep -rlFe "$VAL" playwright-report test-results 2>/dev/null \
              | while read -r f; do
                  VAL="$VAL" perl -i -pe 's/\Q$ENV{VAL}\E/REDACTED/g' "$f"
                done
          done
        shell: bash
      - name: Upload live test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release:
    name: Release Package
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Package the deployed build
        run: |
          # Guard against a silently empty artifact download: the deployed
          # build must contain the entry page and all 100 gallery images.
          test -f dist/index.html || { echo "::error::dist/index.html missing - artifact download failed?"; exit 1; }
          IMG_COUNT=$(find dist/assets -name 'img-*.jpg' | wc -l)
          [ "$IMG_COUNT" -eq 100 ] || { echo "::error::expected 100 images in dist, found $IMG_COUNT"; exit 1; }

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-r${{ github.run_number }}"
          # run_number is stable across re-runs of the same run; suffix the
          # attempt on retries so the tag never collides with an earlier one.
          if [ "${{ github.run_attempt }}" -gt 1 ]; then
            TAG="${TAG}.${{ github.run_attempt }}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          (cd dist && zip -qr "../sphere-${TAG}.zip" .)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "sphere-${TAG}.zip" \
            --target "${{ github.sha }}" \
            --title "Sphere Gallery ${TAG}" \
            --notes "Automated release of commit ${{ github.sha }} after a successful GitHub Pages deployment and live e2e verification.

          Live site: ${{ needs.deploy.outputs.page_url }}
          The attached zip contains the exact build that was deployed."
